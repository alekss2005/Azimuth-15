  for (let i = 0; i < (messages||[]).length; i++) {
    const m = messages[i];
    const text = m.text || "";
    const ch = (m.channel || "unknown").replace(/^@/, "").toLowerCase();
    const msgMs = m.date ? Date.parse(m.date) : now;

    const mod = AI.moderate(text);
    if (!mod.ok) continue;

    /* v14.20.0: детектор баллистических предупреждений */
    if (BALLISTIC_WARN_RE.test(text) && !NON_AIR_CONTEXT_RE.test(text)) {
      ballisticWarnings.push({ text, ch, msgMs });
    }

    const isAltCh = isAltitudeChannel(ch);

    if (isAltCh) {
      const pa = parsePlaceAndAltitude(text);
      if (pa) {
        const key = "pa|" + pa.place.key;
        if (!candidates.has(key)) {
          candidates.set(key, {
            kind:"place", place: pa.place,
            cls: { type:"uav", label:"БПЛА", hard:false },
            target: null, altitudeOverride: pa.altitude,
            channels: new Set(), firstSeen: msgMs, lastSeen: msgMs, sampleText: text
          });
        }
        const c = candidates.get(key);
        c.channels.add(ch);
        if (msgMs < c.firstSeen) c.firstSeen = msgMs;
        if (msgMs > c.lastSeen) c.lastSeen = msgMs;
        c.altitudeOverride = pa.altitude;
        c.sampleText = text;
        lastPlaceByChannel[ch] = key;
        continue;
      }
      const justAlt = isJustAltitude(text);
      if (justAlt != null) {
        const lastKey = lastPlaceByChannel[ch];
        if (lastKey && candidates.has(lastKey)) {
          const c2 = candidates.get(lastKey);
          c2.altitudeOverride = justAlt;
          c2.lastSeen = msgMs;
          c2.channels.add(ch);
        }
        continue;
      }
    }

    const launches = extractLaunchStage(text);
    if (launches.length > 0) {
      for (const L of launches) {
        const key = `reg|${L.key}|${L.cls.type}|${L.stage || "obs"}`;
        if (!candidates.has(key)) {
          candidates.set(key, {
            kind: L.kind, origin: L, cls: L.cls, stage: L.stage,
            region: { key: L.key, name: L.name, lat: L.lat, lon: L.lon },
            target: L.target, count: L.count || null,
            channels: new Set(), firstSeen: msgMs, lastSeen: msgMs, sampleText: text,
            distanceFromKyiv: parseDistanceFromKyiv(text),
            etaRange: parseEtaRange(text)
          });
        }
        const c = candidates.get(key);
        c.channels.add(ch);
        if (msgMs < c.firstSeen) c.firstSeen = msgMs;
        if (msgMs > c.lastSeen) c.lastSeen = msgMs;
        if (text.length < c.sampleText.length) c.sampleText = text;
        if (L.count && (!c.count || L.count > c.count)) c.count = L.count;
        const dKyiv = parseDistanceFromKyiv(text);
        if (dKyiv != null) c.distanceFromKyiv = dKyiv;
        const etaR = parseEtaRange(text);
        if (etaR) c.etaRange = etaR;
      }
      continue;
    }

    const extracted = extractPlaceAndType(text);
    if (extracted) {
      const { place, cls, target, isApproach } = extracted;
      const key = `msg|${place.key}|${cls.type}`;
      if (!candidates.has(key)) {
        candidates.set(key, {
          kind:"place", place, cls, target,
          isApproach: !!isApproach,
          channels: new Set(), firstSeen: msgMs, lastSeen: msgMs, sampleText: text,
          distanceFromKyiv: parseDistanceFromKyiv(text),
          etaRange: parseEtaRange(text),
          countText: parseAircraftCount(text)
        });
      }
      const c = candidates.get(key);
      c.channels.add(ch);
      if (msgMs < c.firstSeen) c.firstSeen = msgMs;
      if (msgMs > c.lastSeen) c.lastSeen = msgMs;
      if (text.length < c.sampleText.length) c.sampleText = text;
      const dKyiv = parseDistanceFromKyiv(text);
      if (dKyiv != null) c.distanceFromKyiv = dKyiv;
      const etaR = parseEtaRange(text);
      if (etaR) c.etaRange = etaR;
      const cnt = parseAircraftCount(text);
      if (cnt && (!c.countText || cnt > c.countText)) c.countText = cnt;
      continue;
    }

    const impact = extractImpact(text);
    if (impact) {
      const key = `imp|${impact.target.key}`;
      if (!impacts.has(key)) {
        impacts.set(key, {
          target: impact.target, channels: new Set(),
          eventAt: null, lastSeen: msgMs, sampleText: text
        });
      }
      const c = impacts.get(key);
      c.channels.add(ch);
      const evt = parseEventTime(text, m.date);
      if (evt && (!c.eventAt || evt > c.eventAt)) c.eventAt = evt;
      if (msgMs < c.lastSeen) c.lastSeen = msgMs;
      if (text.length < c.sampleText.length) c.sampleText = text;
    }
  }

  /* v14.20.0: активация сирены баллистики */
  for (const bw of ballisticWarnings) {
    const strong = BALLISTIC_LAUNCH_RE.test(bw.text) || ZIRCON_RE.test(bw.text);
    /* Требуем минимум 1 источник, если явный "залп/пуск/баллистика на Киев" */
    if (strong) {
      triggerBallisticAlarm();
      break;
    }
  }

  for (const [key, c] of candidates) {
    const confirmN = c.channels.size;
    const totalW = totalWeightOf(c.channels);
    const isThreatSolo = c.stage === "threat" && confirmN < CONFIG.MIN_CHANNELS_CONFIRM;
    const isMig = c.cls && c.cls.isMig;
    const isStrategic = c.cls && c.cls.isStrategic;
    const isAwacs = c.cls && c.cls.isAwacs;
    const isObservation = c.cls && OBSERVATION_TYPES.has(c.cls.type);
    const isBallisticOrZircon = c.cls && (c.cls.type === "ballistic" || c.cls.isZircon);
    const age = now - c.firstSeen;
    const isAltitudeMsg = c.altitudeOverride != null;

    if (isStrategic) { if (confirmN < 1) continue; }
    else if (isMig) { if (confirmN < 1) continue; if (age > CONFIG.STALE_MSG_MS) continue; }
    else if (isAwacs) continue;
    else if (isAltitudeMsg) { if (age > CONFIG.STALE_MSG_MS) continue; }
    else if (isObservation) { if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) continue; if (age > CONFIG.STALE_MSG_MS) continue; }
    else if (isBallisticOrZircon) { if (confirmN < 1) continue; if (age > CONFIG.STALE_MSG_MS) continue; }
    else if (isThreatSolo) { if (age > CONFIG.LAUNCHER_SOLO_TTL_MS) continue; }
    else if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) continue;
    else if (totalW < 2.0) continue;

    if (CONFIG.ROCKET_ONLY_KYIV_OBLAST && c.cls && CONFIG.ROCKET_WARNING_TYPES.has(c.cls.type) && c.place && !inKyivOblast(c.place.lat, c.place.lon)) {
      continue;
    }
    if (CONFIG.ROCKET_ONLY_KYIV_OBLAST && c.cls && CONFIG.ROCKET_WARNING_TYPES.has(c.cls.type) && c.region && !inKyivOblast(c.region.lat, c.region.lon)) {
      continue;
    }

    const aiResult = AI.score({ channels: c.channels, firstSeen: c.firstSeen, place: c.place || c.region, cls: c.cls, target: c.target });

    if (aiResult.level === "critical" && c.place && c.place.lat != null) {
      const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], c.place.lat, c.place.lon);
      if (d < CONFIG.AI_CRITICAL_NEAR_KM) speakCritical(`Увага! ${c.cls.label} курсом на ${c.place.name}. Рівень достовірності високий.`);
    }

    if (c.kind === "strategic") {
      const { region, cls, origin, count } = c;
      if (region.lat != null && region.lon != null) {
        const zoneOk = inZone(region.lat, region.lon) || CONFIG.STRAT_SHOW_OUTSIDE_ZONE;
        if (!zoneOk) continue;
        const fakeThreat = { type:cls.type, _altitude:null, _falling:false, _stage:"ready", _count:count || null, heading:null };
        const marker = L.marker([region.lat, region.lon], { icon: makeIcon(fakeThreat, null, false, confirmN, totalW, null, false, false, false, false, aiResult.level, "ready"), zIndexOffset: 930 });
        marker.bindPopup(`<div class="popup-title type-${cls.type}">Стратегічна авіація · готовність</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b> (${esc(origin.region)})${count ? `<br>Бортов: <b>${count}</b>` : ""}<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult ? AI.badgeHtml(aiResult) : ""}`);
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) { const _old = msgMarkers.get(key); if (_old.marker) msgThreatLayer.removeLayer(_old.marker); }
        msgMarkers.set(key, { marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt:null, falling:false, hdg:null, cls, place:{ name:origin.name, lat:region.lat, lon:region.lon }, targetPlace:null, threat:{ type:cls.type, status:"active" }, isRegion:true, stage:"ready", confirmN, totalWeight:totalW, channels:c.channels, stale:false, trail:null, advisory:false, areaOnly:false, uncertain:false, aiLevel: aiResult.level });
      }
      continue;
    }

    if (c.kind === "mig") {
      const { region, cls, origin } = c;
      if (region.lat == null || region.lon == null) continue;
      const zoneOk = inZone(region.lat, region.lon) || CONFIG.MIG_SHOW_OUTSIDE_ZONE;
      if (!zoneOk) continue;
      const marker = L.marker([region.lat, region.lon], { icon: guessIcon(cls, null, null, false, "takeoff", confirmN, totalW, null, false, false, false, false, null, aiResult.level), zIndexOffset: 935 });
      marker.bindPopup(`<div class="popup-title type-${cls.type}">МиГ-31К · взлёт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b> (${esc(origin.region)})<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult ? AI.badgeHtml(aiResult) : ""}`);
      marker.addTo(msgThreatLayer);
      if (msgMarkers.has(key)) { const _old = msgMarkers.get(key); if (_old.marker) msgThreatLayer.removeLayer(_old.marker); }
      msgMarkers.set(key, { marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt:null, falling:false, hdg:null, cls, place:{ name:origin.name, lat:region.lat, lon:region.lon }, targetPlace:null, threat:{ type:cls.type, status:"active" }, isRegion:true, stage:"takeoff", confirmN, totalWeight:totalW, channels:c.channels, stale:false, trail:null, advisory:false, areaOnly:false, uncertain:false, aiLevel: aiResult.level });
      continue;
    }

    if (c.kind === "observation") {
      const { cls, target } = c;
      const place = c.origin || c.region;
      const src = DEFAULT_SOURCES[cls.type];
      let arrowBearing = 0;
      if (target) arrowBearing = bearingBetween(place.lat, place.lon, target.lat, target.lon);
      else if (needsTrail(cls.type)) {
        const { origin, dist } = nearestRussianOrigin(place.lat, place.lon);
        if (origin && dist >= CONFIG.TRAIL_MIN_ORIGIN_DIST_KM) arrowBearing = bearingBetween(origin.lat, origin.lon, place.lat, place.lon);
      } else if (src) arrowBearing = (bearingBetween(place.lat, place.lon, src.lat, src.lon) + 180) % 360;

      const chainKey = `${cls.type}|obs|${(target && target.key) || place.key}`;
      const chain = appendTrailPoint(chainKey, cls, { lat: place.lat, lon: place.lon, name: place.name }, ch, msgMs);
      chain.aiResult = aiResult;
      chain.heading = arrowBearing;
      const last = chain.points[chain.points.length - 1];

      let markerRef = chain.markerRef;
      if (markerRef && markerRef.marker) {
        markerRef.marker.setLatLng([last.lat, last.lon]);
        markerRef.marker.setIcon(guessIcon(cls, arrowBearing, null, false, null, confirmN, totalW, null, false, false, false, false, null, aiResult.level));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      } else {
        const marker = L.marker([last.lat, last.lon], { icon: guessIcon(cls, arrowBearing, null, false, null, confirmN, totalW, null, false, false, false, false, null, aiResult.level), zIndexOffset: 900 });
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen", () => openTrail(chainKey));
        marker.on("popupclose", () => closeTrailDrawing(chainKey));
        markerRef = { marker, trailLine: null, trailPoints: null };
        chain.markerRef = markerRef;
      }
      msgMarkers.set(key, { marker: markerRef.marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt:null, falling:false, hdg:arrowBearing, cls, place, targetPlace: target, threat: { type: cls.type, status:"active", _speed: 0 }, confirmN, totalWeight: totalW, channels: c.channels, heading: arrowBearing, speedKmh: 0, stage: null, stale: false, trail: null, advisory: false, areaOnly: false, uncertain: false, aiLevel: aiResult.level, chainKey });

      if (CONFIG.SOUND_ENABLED && CONFIG.SOUND_TYPE_FILTER.has(cls.type) && place.lat != null) {
        const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], place.lat, place.lon);
        if (d <= CONFIG.SOUND_NEAR_KM) {
          const sKey = key;
          const lastSound = lastSoundByPlace[sKey] || 0;
          if (now - lastSound > CONFIG.SOUND_NEAR_WINDOW_MS) {
            lastSoundByPlace[sKey] = now;
            playAlertSound(aiResult.level === "critical" ? "critical" : "normal");
          }
        }
      }
      continue;
    }

    if (c.kind === "region" || c.kind === "origin" || c.kind === "default" || c.kind === "guess") {
      const { region, cls, stage, origin, target } = c;
      const originLabel = origin.kind === "origin" ? `${origin.name}` : origin.name;
      if (!inZone(region.lat, region.lon)) continue;
      let marker;
      const etaRange = c.etaRange;
      const distKyiv = c.distanceFromKyiv;
      const etaRangeHtml = etaRange ? `<div class="popup-eta">⏱ Підліт: ~${etaRange[0]}${etaRange[1] !== etaRange[0] ? "-" + etaRange[1] : ""} хв</div>` : "";
      const distKyivHtml = distKyiv != null ? `<div class="popup-distance">📏 ${distKyiv} км від Києва</div>` : "";
      if (stage === "launch") {
        const targetBearing = target ? bearingBetween(region.lat, region.lon, target.lat, target.lon) : bearingBetween(region.lat, region.lon, 50.45, 30.52);
        const fakeThreat = { type:cls.type, _altitude:null, _falling:false, _stage:"launch", heading:targetBearing, _count: c.count || null };
        marker = L.marker([region.lat, region.lon], { icon: makeIcon(fakeThreat, targetBearing, true, confirmN, totalW, null, false, false, false, false, aiResult.level, stage), zIndexOffset: 950 });
        marker.bindPopup(`<div class="popup-title type-${cls.type}">ПУСК · ${cls.label}${c.count ? ` · ${c.count} шт` : ""}</div><div>${esc(c.sampleText.slice(0,220))}</div>${distKyivHtml}${etaRangeHtml}<div class="popup-meta"><b>${esc(originLabel)}</b><br>Курс: ${Math.round(targetBearing)}°${target ? `<br>Цель: ${esc(target.name)}` : ""}<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult ? AI.badgeHtml(aiResult) : ""}`);
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) { const _old = msgMarkers.get(key); if (_old.marker) msgThreatLayer.removeLayer(_old.marker); }
        msgMarkers.set(key, { marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt:null, falling:false, hdg:targetBearing, cls, place:{ name:originLabel, lat:region.lat, lon:region.lon }, targetPlace: target, eta:null, threat:{ type:cls.type, status:"active" }, confirmN, totalWeight:totalW, channels:c.channels, moveBase:{ lat:region.lat, lon:region.lon, t:c.firstSeen }, heading: targetBearing, stage:"launch", stale:false, trail:null, advisory:false, areaOnly:false, uncertain:false, aiLevel: aiResult.level, etaRange, distKyiv });
      } else {
        marker = L.marker([region.lat, region.lon], { icon: launcherIcon(stage, originLabel, confirmN, totalW, aiResult.level), zIndexOffset: 940 });
        marker.bindPopup(`<div class="popup-title type-launcher">ЗАГРОЗА · ${cls.label}</div><div>${esc(c.sampleText.slice(0,220))}</div>${distKyivHtml}${etaRangeHtml}<div class="popup-meta"><b>${esc(originLabel)}</b><br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult ? AI.badgeHtml(aiResult) : ""}`);
        marker.addTo(msgThreatLayer);
        if (msgMarkers.has(key)) { const _old = msgMarkers.get(key); if (_old.marker) msgThreatLayer.removeLayer(_old.marker); }
        msgMarkers.set(key, { marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt:null, falling:false, hdg:null, cls, place:{ name:originLabel, lat:region.lat, lon:region.lon }, targetPlace: target, threat:{ type:cls.type, status:"active" }, isRegion:true, stage, confirmN, totalWeight:totalW, channels:c.channels, stale:false, trail:null, advisory:false, areaOnly:false, uncertain:false, aiLevel: aiResult.level, etaRange, distKyiv });
      }
      continue;
    }

    if (c.kind === "place") {
      const { place, cls, target, isApproach } = c;
      if (!inZone(place.lat, place.lon) && !(target && inZone(target.lat, target.lon))) continue;

      const alt = c.altitudeOverride != null ? c.altitudeOverride : parseAltitude({ explanationShort: c.sampleText });
      const falling = isFallingMessage(c.sampleText);

      let hdg = null;
      if (target) hdg = bearingBetween(place.lat, place.lon, target.lat, target.lon);
      else if (!isApproach) {
        const { origin, dist } = nearestRussianOrigin(place.lat, place.lon);
        if (origin && dist >= CONFIG.TRAIL_MIN_ORIGIN_DIST_KM) hdg = bearingBetween(origin.lat, origin.lon, place.lat, place.lon);
      }

      const displayPos = [place.lat, place.lon];
      const speed = CONFIG.FALLBACK_SPEED[cls.type] || CONFIG.FALLBACK_SPEED.unknown;
      let eta = null;
      if (target && !isApproach) {
        const distKm = haversineKm(displayPos[0], displayPos[1], target.lat, target.lon);
        eta = distKm / speed * 60;
      }

      const chainKey = `${cls.type}|${(target && target.key) || place.key}|${(cls.isGeran5 || cls.type === "geran5") ? "g5" : "std"}`;
      const chain = appendTrailPoint(chainKey, cls, { lat: displayPos[0], lon: displayPos[1], name: (target && target.name) || place.name }, ch, msgMs);
      chain.aiResult = aiResult;
      chain.heading = hdg;
      if (target) {
        chain.targetName = target.name;
        chain.targetLat = target.lat;
        chain.targetLon = target.lon;
      }
      chain.msgKey = key;
      if (c.distanceFromKyiv != null) chain.distanceFromKyiv = c.distanceFromKyiv;
      if (c.etaRange) { chain.etaMinLo = c.etaRange[0]; chain.etaMinHi = c.etaRange[1]; }

      const last = chain.points[chain.points.length - 1];
      let markerRef = chain.markerRef;
      if (markerRef && markerRef.marker) {
        markerRef.marker.setLatLng([last.lat, last.lon]);
        markerRef.marker.setIcon(guessIcon(cls, hdg, alt, falling, null, confirmN, totalW, eta, false, false, false, false, place._kyivArea, aiResult.level));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      } else {
        const marker = L.marker([last.lat, last.lon], { icon: guessIcon(cls, hdg, alt, falling, null, confirmN, totalW, eta, false, false, false, false, place._kyivArea, aiResult.level), zIndexOffset: 900 });
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen", () => openTrail(chainKey));
        marker.on("popupclose", () => closeTrailDrawing(chainKey));
        markerRef = { marker, trailLine: null, trailPoints: null };
        chain.markerRef = markerRef;
      }
      msgMarkers.set(key, { marker: markerRef.marker, lastSeen: c.lastSeen, firstSeen: c.firstSeen, alt, falling, hdg, cls, place, targetPlace: target, eta, threat: { type: cls.type, status: "active", _falling: falling }, confirmN, totalWeight: totalW, channels: c.channels, heading: hdg, speedKmh: speed, stage: null, stale: false, trail: null, advisory: false, areaOnly: false, uncertain: false, isApproach: !!isApproach, aiLevel: aiResult.level, chainKey });

      if (CONFIG.SOUND_ENABLED && CONFIG.SOUND_TYPE_FILTER.has(cls.type) && place.lat != null) {
        const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], place.lat, place.lon);
        if (d <= CONFIG.SOUND_NEAR_KM) {
          const sKey = key;
          const lastSound = lastSoundByPlace[sKey] || 0;
          if (now - lastSound > CONFIG.SOUND_NEAR_WINDOW_MS) {
            lastSoundByPlace[sKey] = now;
            playAlertSound(aiResult.level === "critical" ? "critical" : "normal");
          }
        }
      }
      continue;
    }
  }

  const nowTs = Date.now();
  for (const [key, chain] of [...trails]) {
    if (nowTs - chain.lastSeen > CONFIG.TRAIL_MAX_AGE_MS && !chain.reached) closeTrail(key);
  }

  checkReachedTargets();

  for (const [key, c] of impacts) {
    const confirmN = c.channels.size;
    const totalW = totalWeightOf(c.channels);
    if (confirmN < CONFIG.MIN_CHANNELS_CONFIRM) continue;
    if (totalW < 2.0) continue;
    const eventAt = c.eventAt || c.lastSeen;
    const age = now - eventAt;
    if (age > CONFIG.IMPACT_TTL_MS) {
      if (impactMarkers.has(key)) { impactLayer.removeLayer(impactMarkers.get(key).marker); impactMarkers.delete(key); }
      continue;
    }
    if (!inZone(c.target.lat, c.target.lon)) continue;
    const t = c.target;
    const aiResult = AI.score({ channels: c.channels, firstSeen: eventAt, place: t, cls: null, target: t });
    const marker = L.marker([t.lat, t.lon], { icon: impactIcon(confirmN, eventAt, totalW, aiResult.level), zIndexOffset: 880 });
    marker.bindPopup(`<div class="popup-title type-impact">Взрыв / прилёт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta">Місце: <b>${esc(t.name)}</b><br>Когда: <b>${formatAgeShort(age)}</b><br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult ? AI.badgeHtml(aiResult) : ""}`);
    marker.addTo(impactLayer);
    if (impactMarkers.has(key)) impactLayer.removeLayer(impactMarkers.get(key).marker);
    impactMarkers.set(key, { marker, lastSeen: eventAt, eventAt, confirmN, channels: c.channels, aiLevel: aiResult.level });
  }

  for (const [key, o] of [...msgMarkers]) {
    if (now - o.lastSeen > CONFIG.STALE_MSG_MS) {
      if (o.marker) msgThreatLayer.removeLayer(o.marker);
      msgMarkers.delete(key);
    }
  }
  for (const [key, o] of [...impactMarkers]) {
    if (now - (o.eventAt || o.lastSeen) > CONFIG.IMPACT_TTL_MS) {
      impactLayer.removeLayer(o.marker);
      impactMarkers.delete(key);
    }
  }
}

/* ============================================================
   Анимация API-треков
============================================================ */
let rafId = null;
let animRunning = false;

function animate() {
  if (!animRunning) return;
  const now = Date.now();

  for (const tr of tracks.values()) {
    if (tr.heading == null) continue;
    if (tr.threat._falling) continue;
    if (tr.threat.areaOnly) continue;
    if (tr.threat.advisory) continue;
    const elapsedH = (now - tr.baseTime) / 3600000;
    const capped = Math.min(Math.max(elapsedH, 0), CONFIG.EXTRAPOLATION_HOURS);
    const speed = CONFIG.FALLBACK_SPEED[tr.threat.type] || CONFIG.FALLBACK_SPEED.unknown;
    const distKm = speed * capped;
    const [lat, lon] = destPoint(tr.baseLat, tr.baseLon, tr.heading, distKm);
    tr.marker.setLatLng([lat, lon]);

    const last = tr.history[tr.history.length - 1];
    if (!last || haversineKm(last.lat, last.lon, lat, lon) > CONFIG.API_TRAIL_MIN_GAP_KM) {
      tr.history.push({ lat, lon, t: now });
      if (tr.history.length > CONFIG.API_TRAIL_MAX_POINTS) tr.history.shift();
    }
  }
  rafId = requestAnimationFrame(animate);
}
function startAnim() { if (animRunning) return; animRunning = true; rafId = requestAnimationFrame(animate); }
function stopAnim() { animRunning = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

/* ============================================================
   AI-сводка с ETA
============================================================ */
function buildSituationSummary() {
  const lines = [];
  if (lastAlerts) {
    let kyivAlert = false, oblAlert = false;
    for (const list of [lastAlerts.raions, lastAlerts.oblasts]) {
      for (const a of (list || [])) {
        const s = String(a.key || "") + " " + String(a.name || "");
        if (/київ(?!ськ)|киев(?!ск)/i.test(s)) { if (/обл/i.test(s)) oblAlert = true; else kyivAlert = true; }
      }
    }
    if (kyivAlert) lines.push("🔴 Киев: ВОЗДУШНАЯ ТРЕВОГА");
    else if (oblAlert) lines.push("🟠 Киевская область: воздушная тревога");
    else lines.push("🟢 Официальной тревоги в Киеве и области нет");
  } else lines.push("ℹ Нет данных об алертах");

  /* v14.20.0: тревога баллистики */
  if (ballisticAlarmActiveUntil > Date.now()) {
    lines.push("🚨 АКТИВНА ТРЕВОГА БАЛЛИСТИКИ (сработала сирена)");
  }

  const activeTracks = [...tracks.values()].filter(t => !t.threat.areaOnly && !t.threat.advisory);
  lines.push("");
  if (activeTracks.length === 0) lines.push("✈ API-треков в зоне: нет");
  else {
    lines.push(`✈ API-треков в зоне: ${activeTracks.length}`);
    const byType = {};
    for (const tr of activeTracks) byType[tr.threat.type] = (byType[tr.threat.type] || 0) + 1;
    for (const [t, n] of Object.entries(byType)) {
      const meta = TYPE_META[t];
      lines.push(`   • ${meta ? meta.label : t}: ${n}`);
    }
  }

  lines.push("");
  if (msgMarkers.size === 0) lines.push("📡 Активных сообщений: нет");
  else {
    lines.push(`📡 Активных сообщений: ${msgMarkers.size}`);
    const byType = {};
    for (const o of msgMarkers.values()) if (o.cls) byType[o.cls.type] = (byType[o.cls.type] || 0) + 1;
    const names = { uav:"БПЛА", recon:"Разведка", geran5:"Герань-5", missile:"КР", ballistic:"Баллистика", zircon:"Циркон", jet_drone:"Реакт. Герань", banderol:"S8000", mig31k:"МиГ-31К", kab:"КАБ", umpb:"УМПБ", fpv:"FPV", strategic_aviation:"Стратег. авиация" };
    for (const [t, n] of Object.entries(byType)) lines.push(`   • ${names[t] || t}: ${n}`);
  }

  lines.push("");
  lines.push(`🧩 Цепочек траекторий: ${trails.size}`);
  const reachedCount = [...trails.values()].filter(c => c.reached).length;
  if (reachedCount > 0) lines.push(`💥 Достигли цели: ${reachedCount}`);

  lines.push("");
  let nearest = null, nearestD = Infinity;
  for (const tr of tracks.values()) {
    if (tr.threat.areaOnly || tr.threat.advisory) continue;
    const ll = tr.marker.getLatLng();
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng);
    if (d < nearestD) {
      nearestD = d;
      const speed = CONFIG.FALLBACK_SPEED[tr.threat.type] || CONFIG.FALLBACK_SPEED.unknown;
      const etaMin = (d / speed) * 60;
      nearest = { src: "api", label: typeLabel(tr.threat), name: tr.threat.locality || tr.threat.region || "—", etaMin, speed };
    }
  }
  for (const o of msgMarkers.values()) {
    if (!o.marker) continue;
    if (o.cls && (o.cls.isMig || o.cls.isStrategic)) continue;
    const ll = o.marker.getLatLng();
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng);
    if (d < nearestD) {
      nearestD = d;
      const speed = (o.cls && CONFIG.FALLBACK_SPEED[o.cls.type]) || CONFIG.FALLBACK_SPEED.unknown;
      const etaMin = (d / speed) * 60;
      nearest = { src: "msg", label: o.cls ? o.cls.label : "объект", name: o.place ? o.place.name : "?", etaMin, speed };
    }
  }
  if (nearest && nearestD < 500) {
    const src = nearest.src === "api" ? " (API)" : "";
    let etaStr = "";
    if (nearest.etaMin != null && nearest.etaMin > 0 && nearest.etaMin < 300) {
      etaStr = `, подлёт ${formatEta(nearest.etaMin)}`;
    }
    lines.push(`🎯 Ближайшее: ${nearest.label}${src} — ${nearest.name} (${Math.round(nearestD)} км от Киева${etaStr})`);
  } else lines.push("🎯 В зоне Киева — чисто");

  return lines.join("\n");
}

function showAIExplain() {
  const text = buildSituationSummary();
  const backdrop = $("aiModalBackdrop");
  const body = $("aiModalBody");
  const timeEl = $("aiModalTime");
  if (!backdrop || !body) { showToast(text.split("\n")[0], 3000); return; }
  body.textContent = text;
  if (timeEl) timeEl.textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU");
  backdrop.classList.add("show");
}
function hideAIExplain() { const b = $("aiModalBackdrop"); if (b) b.classList.remove("show"); }

(function initAIModal(){
  const backdrop = $("aiModalBackdrop");
  const closeBtn = $("aiModalClose");
  const copyBtn = $("aiModalCopy");
  if (!backdrop) return;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) hideAIExplain(); });
  if (closeBtn) closeBtn.addEventListener("click", hideAIExplain);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && backdrop.classList.contains("show")) hideAIExplain(); });
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      const body = $("aiModalBody");
      if (!body) return;
      try {
        await navigator.clipboard.writeText(body.textContent || "");
        copyBtn.textContent = "✅ Скопировано";
        setTimeout(() => { copyBtn.textContent = "📋 Копировать"; }, 1500);
      } catch (e) {
        copyBtn.textContent = "❌ Не удалось";
        setTimeout(() => { copyBtn.textContent = "📋 Копировать"; }, 1500);
      }
    });
  }
})();

/* ============================================================
   WebSocket + REST
============================================================ */
let ws = null;
let wsConnected = false;
let wsReconnectMs = CONFIG.WS_RECONNECT_MS;
let wsReconnectTimer = null;
let restFallbackActive = false;
let pollTimer = null;
let msgPollTimer = null;
let abortCtrl = null;

const wsState = { threats: new Map(), alerts: null };

function wsScheduleReconnect() {
  if (wsReconnectTimer) return;
  wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; wsConnect(); }, wsReconnectMs);
  wsReconnectMs = Math.min(wsReconnectMs * 2, CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect() {
  try {
    if (ws) { try { ws.close(); } catch {} ws = null; }
    ws = new WebSocket(CONFIG.WS_URL);
    ws.onopen = () => {
      wsConnected = true;
      wsReconnectMs = CONFIG.WS_RECONNECT_MS;
      restFallbackActive = false;
      stopRestPolling();
      updateLiveBadge("ok");
      console.log("[ws] connected");
    };
    ws.onmessage = (e) => {
      try {
        const env = JSON.parse(e.data);
        wsHandleFrame(env);
      } catch (err) { console.warn("[ws] parse", err); }
    };
    ws.onerror = () => {};
    ws.onclose = () => {
      wsConnected = false;
      ws = null;
      console.log("[ws] closed");
      updateLiveBadge("err");
      if (!restFallbackActive) { restFallbackActive = true; startRestPolling(); }
      wsScheduleReconnect();
    };
  } catch (e) {
    console.warn("[ws] create failed", e);
    if (!restFallbackActive) { restFallbackActive = true; startRestPolling(); }
    wsScheduleReconnect();
  }
}
function wsHandleFrame(env) {
  if (!env || !env.type) return;
  switch (env.type) {
    case "snapshot": {
      const data = env.data || {};
      const list = data.threats || [];
      wsState.threats.clear();
      for (const t of list) if (t.id) wsState.threats.set(t.id, t);
      if (data.alerts) {
        wsState.alerts = data.alerts;
        try { syncAlertPolygons(data.alerts); } catch (e) {}
      }
      applyThreatsFromWs();
      break;
    }
    case "upsert": {
      const t = env.data;
      if (!t || !t.id) return;
      wsState.threats.set(t.id, t);
      applyThreatsFromWs();
      break;
    }
    case "remove": {
      const data = env.data || {};
      if (data.id) wsState.threats.delete(data.id);
      applyThreatsFromWs();
      break;
    }
    case "alerts": {
      const data = env.data || {};
      wsState.alerts = data;
      try { syncAlertPolygons(data); } catch (e) {}
      break;
    }
    case "heartbeat": break;
  }
}
function applyThreatsFromWs() {
  const list = [...wsState.threats.values()];
  try { syncThreats(list); } catch (e) { console.warn(e); }
}

async function fetchMessages() {
  try {
    const r = await fetch(CONFIG.API_MESSAGES);
    if (!r.ok) throw new Error("messages "+r.status);
    const data = await r.json();
    try { syncMessageThreats(data.messages || []); } catch (e) { console.warn(e); }
  } catch (e) {}
}
async function fetchThreatsAndAlerts() {
  try {
    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();
    const signal = abortCtrl.signal;
    const [tr, al] = await Promise.all([
      fetch(CONFIG.API_THREATS, { signal }).then(r => { if (!r.ok) throw new Error("threats "+r.status); return r.json(); }),
      fetch(CONFIG.API_ALERTS, { signal }).then(r => { if (!r.ok) throw new Error("alerts "+r.status); return r.json(); })
    ]);
    const threats = tr.threats || [];
    try { syncThreats(threats); } catch (e) { console.warn(e); }
    try { syncAlertPolygons(al); } catch (e) { console.warn(e); }
    updateLiveBadge("ok");
  } catch (e) {
    if (e.name === "AbortError") return;
    console.warn("fetchThreatsAndAlerts", e);
    updateLiveBadge("err");
  }
}
async function restPollLoop() {
  await fetchThreatsAndAlerts();
  await fetchMessages();
  pollTimer = setTimeout(restPollLoop, CONFIG.POLL_MS);
}
function startRestPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  restPollLoop();
}
function stopRestPolling() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
}

function updateLiveBadge(state) {
  const badge = $("liveBadge");
  if (!badge) return;
  if (state === "ok") {
    badge.textContent = wsConnected ? "онлайн · WS" : "онлайн";
    badge.className = "live-badge live" + (wsConnected ? " ws" : "");
  } else if (state === "err") {
    badge.textContent = "ошибка";
    badge.className = "live-badge stale";
  }
}

/* ============================================================
   UI
============================================================ */
function clearAll() {
  msgMarkers.forEach(o => { if (o.marker) try { msgThreatLayer.removeLayer(o.marker); } catch {} });
  msgMarkers.clear();
  impactMarkers.forEach(o => { if (o.marker) try { impactLayer.removeLayer(o.marker); } catch {} });
  impactMarkers.clear();
  tracks.forEach(tr => { if (tr.marker) try { threatLayer.removeLayer(tr.marker); } catch {} });
  tracks.clear();
  for (const key of [...trails.keys()]) closeTrail(key);
  trails.clear();
  reachedLayer.clearLayers();
}

$("btnRefresh").addEventListener("click", () => {
  if (wsConnected && ws) { try { ws.close(); } catch {} wsConnect(); }
  else startRestPolling();
  showToast("Обновление…");
});
$("btnClear").addEventListener("click", () => { clearAll(); showToast("Очищено"); });
$("btnAIExplain").addEventListener("click", showAIExplain);

/* Кнопка звука */
(function initSoundToggle() {
  const btn = $("soundToggle");
  if (!btn) return;
  btn.addEventListener("click", () => {
    CONFIG.SOUND_ENABLED = !CONFIG.SOUND_ENABLED;
    btn.textContent = CONFIG.SOUND_ENABLED ? "🔔" : "🔕";
    btn.className = "sound-toggle " + (CONFIG.SOUND_ENABLED ? "on" : "muted");
    if (CONFIG.SOUND_ENABLED) {
      initAudio();
      if (audioCtx) {
        audioCtx.resume().then(() => {
          audioUnlocked = true;
          playAlertSound("normal");
        }).catch(() => {});
      }
      showToast("Звук включен");
    } else {
      if (audioCtx && audioCtx.state === "running") {
        audioCtx.suspend().catch(() => {});
      }
      showToast("Звук выключен");
    }
  });
  document.addEventListener("pointerdown", function unlock() {
    if (CONFIG.SOUND_ENABLED) {
      initAudio();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().then(() => { audioUnlocked = true; }).catch(() => {});
      } else if (audioCtx) audioUnlocked = true;
    }
    document.removeEventListener("pointerdown", unlock);
  }, { once: true });
})();

/* v14.20.0: кнопка сирены */
(function initSirenToggle() {
  const btn = $("sirenToggle");
  if (!btn) return;
  btn.addEventListener("click", () => {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    triggerSirenSequence(3000, 3);
    ballisticAlarmActiveUntil = Date.now() + CONFIG.SIREN_ALERT_TTL_MS;
    showToast("🚨 Тест сирены (3 сигнала)");
  });
})();

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopRestPolling(); stopAnim(); }
  else { if (!wsConnected) startRestPolling(); startAnim(); }
});

/* ============================================================
   СТАРТ
============================================================ */
(async function init() {
  const ctrl = new AbortController();
  loadAlertGeo(ctrl.signal);
  wsConnect();
  fetchMessages();
  setInterval(fetchMessages, 5000);
  startAnim();
})();
